name: Generate Bella and Michael audio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-audio.yml"

permissions:
  contents: write

concurrency:
  group: generate-kokoro-audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install speech tools
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          python -m pip install "kokoro>=0.9,<1" soundfile

      - name: Generate Bella audio
        run: python scripts/generate_audio.py --voice bella

      - name: Save Bella audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/bella
          git diff --cached --quiet || git commit -m "Add Bella pronunciation audio"
          git push

      - name: Generate Michael audio
        run: python scripts/generate_audio.py --voice michael

      - name: Save Michael audio
        run: |
          git add audio/michael
          git diff --cached --quiet || git commit -m "Add Michael pronunciation audio"
          git push
