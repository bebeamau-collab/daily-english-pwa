name: Generate slower Jasper audio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_jasper_audio.py"
      - ".github/workflows/generate-jasper-audio.yml"

permissions:
  contents: write

concurrency:
  group: generate-daily-english-audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install speech tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install "https://github.com/KittenML/KittenTTS/releases/download/0.8.1/kittentts-0.8.1-py3-none-any.whl" soundfile

      - name: Validate short, medium, and long speech
        run: python scripts/generate_jasper_audio.py --speed 0.95 --smoke-test

      - name: Generate Jasper audio
        run: python scripts/generate_jasper_audio.py --speed 0.95

      - name: Save Jasper audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/jasper
          git diff --cached --quiet || git commit -m "Add slower Jasper pronunciation audio"
          git push
